# Hackerman, from Omarchy, with true-black backgrounds for OLED panels. The
# shell (bar, OSD, notifications, launcher, menus, lock screen) and the
# generated terminal themes all take their background from these keys, so
# unused pixels stay off. lighter_background stays lit so hover and selected
# surfaces remain visible. Every other value is Hackerman's.

mode = "dark"

accent = "#82FB9C"
selection = "#1f253a"
muted = "#2d3450"

background = "#000000"
dark_background = "#000000"
darker_background = "#000000"
lighter_background = "#151828"

foreground = "#ddf7ff"
dark_foreground = "#6a6e95"
light_foreground = "#b5c5db"
bright_foreground = "#ddf7ff"

hyprland_active_border = "rgba(26a269ee) rgba(2ec27eee) 45deg"

red = "#50f872"
yellow = "#50f7d4"
orange = "#50f7a3"
green = "#4fe88f"
cyan = "#7cf8f7"
blue = "#829dd4"
magenta = "#86a7df"
brown = "#287b51"

bright_red = "#85ff9d"
bright_yellow = "#a4ffec"
bright_green = "#9cf7c2"
bright_cyan = "#d1fffe"
bright_blue = "#c4d2ed"
bright_magenta = "#cddbf4"
